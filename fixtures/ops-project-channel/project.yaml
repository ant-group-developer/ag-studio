schema_version: harness.project-config/v1
project_id: project-channel
template_release: 0.1.0
runtime: claude
data_root: ./data
portfolios:
  - { portfolio_id: portfolio-channel, display_name: Channel }
source: { materialize: link }
# Same kho as the studio fixture, mounted read-mostly: a channel only ever writes `requests/<id>.json`
# and `items/<id>/claims/<channel_id>.json` (enforced by LibraryFs.assertWritable).
library: { root: ./library, role: channel }
# The channel role also runs channel-publish (Task 11): fetch/build-package/upload/schedule are the built-in
# publish-* commands (no executors/ wrapper needed, same as library-*), so scoping doctor to just this release
# never asks for a scripts.yaml this project doesn't have.
workflows: [channel-publish@1.0.0]
# upload/schedule both requires_resources: [browser] (workflow.yaml); one slot is enough since production
# profile channel's limits.max_concurrency is 1.
resources: { browser: 1 }
adapters:
  publisher: playwright
  agent: cli
  # "node" / "../fake-agent-cli.mjs" only resolve correctly from *this* fixture directory (mirroring
  # channels/*/channel.yaml's repo_dir); tests/integration/publish-helpers.ts's freshPublishWorld rewrites
  # both to absolute paths (argv[0] -> process.execPath) before writing project.yaml into a temp project.
  agent_argv: [node, ../fake-agent-cli.mjs, "{prompt}"]
