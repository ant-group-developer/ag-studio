# executors/scripts.yaml — one entry per script-backed stage of the workflow(s) this project plans.
# `executor.script` in a workflow.yaml must name a key here (or a built-in fake used only by the harness's
# own tests). `harness doctor` checks that every argv[1] wrapper file exists, every env_refs secret
# resolves, and every requires_resources name has capacity > 0 in project.yaml.
#
# Fields per script:
#   argv                — command + args; argv[0] is usually "node", argv[1] the wrapper .mjs below.
#   cwd                 — resolved against this project directory; defaults to "." when omitted.
#   env_refs            — NAME: "secret://scope/name" pairs resolved into the child process's env only
#                         (never written to a file, event or log); set the matching
#                         HARNESS_SECRET_<SCOPE>_<NAME> env var in the shell that runs `harness worker`
#                         (or in a machine-local .env loaded by that shell) — do not commit the value.
#   requires_resources  — shared resource name(s) this script needs a slot of; when set here it overrides
#                         the workflow stage's own requires_resources for this project.
#   timeout_seconds     — caps the attempt's deadline for this script; a run that exceeds it fails
#                         "transient" and retries like any other transient failure.
#
# None of the six wrapper files referenced below exist yet in this template. Copy
# executors/wrappers/example.mjs to each name, point it at the matching legacy script per
# docs/runbooks/wrap-a-channel.md, then delete the entries (and matching workflow stages) you don't need —
# this list mirrors fixtures/ops-project-footage/executors/scripts.yaml only as a starting shape.
schema_version: harness.scripts/v1
scripts:
  index-source:     { argv: [node, executors/wrappers/index-source.mjs], requires_resources: [cpu], timeout_seconds: 600 }
  tts:              { argv: [node, executors/wrappers/tts.mjs], requires_resources: [gpu], timeout_seconds: 600 }
  avatar:           { argv: [node, executors/wrappers/avatar.mjs], env_refs: { HEYGEN_API_KEY: "secret://heygen/main" }, requires_resources: [heygen], timeout_seconds: 600 }
  cut:              { argv: [node, executors/wrappers/cut.mjs], requires_resources: [cpu], timeout_seconds: 600 }
  assemble:         { argv: [node, executors/wrappers/assemble.mjs], requires_resources: [cpu], timeout_seconds: 600 }
  thumbnail-render: { argv: [node, executors/wrappers/thumbnail-render.mjs], timeout_seconds: 600 }
  # transcribe: { argv: [node, executors/wrappers/transcribe.mjs], timeout_seconds: 900 }
  #   # sub-project 4, optional: the built-in `harness media watch` stage (style-study@1.1.0,
  #   # library-production@1.1.0) shells this out for every video it watches, when this entry is present at
  #   # all -- not declaring it is a valid choice, and `watch.json` then writes `transcript: null` for every
  #   # video, no error. This project's core does not know what transcription tool is behind the wrapper
  #   # (whisper, a paid API, ...); it only knows the contract below. `env_refs` is deliberately never
  #   # resolved for this entry even if you add one -- a transcription CLI has no legitimate reason to see a
  #   # secret, so `watch` never passes any.
  #   # Contract: `node executors/wrappers/transcribe.mjs --in <path to the media file> --out <path to write
  #   # JSON to>` (both absolute paths, chosen by `watch`, not by you). The wrapper must write
  #   # `{ segments: [{ start: <seconds>, end: <seconds>, text: <string> }] }` to `--out` and exit 0. A
  #   # nonzero exit, a timeout (`timeout_seconds` above), or JSON that fails to parse/match that shape is not
  #   # a stage failure -- `watch` logs a warning, writes `transcript: null` plus a `transcript_error` string
  #   # for that video, and the `watch` stage still `succeeded`. See docs/runbooks/studio-autopilot.md §1.
