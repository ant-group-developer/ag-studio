# Copy this directory to create an operations project, then edit the values below.
schema_version: harness.project-config/v1
project_id: project-CHANGE-ME
template_release: 0.1.0
runtime: claude            # claude | codex, chosen per machine/project
data_root: ../youtube-operations-data
portfolios:
  - { portfolio_id: portfolio-main, display_name: Main portfolio }
resources: { cpu: 2, gpu: 1 }
source: { materialize: link }
# workflows: [footage-production@1.0.0]  # workflow releases this machine runs; `doctor` checks only these
                                          # (and their profiles) instead of every workflow in the harness.
                                          # Leave unset to check everything installed.
# library: { root: /path/to/shared-kho, role: studio, sync_seconds: 300 }
#   # role: studio | channel. studio writes styles/ and items/ (produces episodes); channel writes
#   # requests/<id>.json and items/<id>/claims/<channel_id>.json (asks for and picks up content). Both
#   # machines must point root at the same mounted share. sync_seconds (min 10, default 300) caps how
#   # often `harness worker` syncs the kho on its own when idle. See docs/runbooks/content-library.md.
#   auto_accept:            # sub-project 4, studio role only: turns on the autopilot loop -- a fulfilled
#                            # channel request is claimed, planned and run with no human command beyond
#                            # `harness worker`. Absent (or the whole `library:` block absent) = off, same
#                            # as today's fully-manual 2C flow. See docs/runbooks/studio-autopilot.md.
#     enabled: true
#     source_collection: main   # named source collection auto-accept pulls from when a request has no
#                                # --source-hint of its own; must have at least one ingested source or
#                                # `harness doctor`'s `library:auto_accept` row fails.
#     max_replans: 2            # how many more runs a request gets after a `library-review` rejection
#                                # before the dashboard raises a `request_stuck` alert and auto-accept gives
#                                # up on it (max_replans + 1 runs total per request).
#     max_concurrent_runs: 1    # runs auto-accept itself may have RUNNING/READY/WAITING at once; does not
#                                # cap runs planned by hand (`harness library accept` + `plan`).
#     # --- sub-project 5A: a shooting session is a COLLECTION, not a single clip ---------------------------
#     source_collections: ["shoot-*"]   # glob patterns. SETTING THIS SWITCHES MODES: a request now takes a
#                                # WHOLE matching collection (`harness source ingest <dir> --collection
#                                # shoot-2026-09-21`), and a collection a successful run already used is
#                                # marked used so no other request picks it again (the request's own replan
#                                # is exempt). LEAVING IT UNSET keeps sub-project 4's behaviour exactly:
#                                # one source per request, busy tracked per source. Must have >= 1 pattern.
#     max_sources: 40           # cap on how many clips of a collection one request may draw.
#     workflow_release: library-production@1.1.0   # pins the autopilot to ONE release instead of following
#                                # the studio profile's own workflow_release. This is the documented rollback
#                                # out of library-production@1.2.0 (the media release) -- unset means "plan
#                                # whatever the profile currently points at". `harness plan --workflow
#                                # <id>@<ver>` by hand always overrides both.
#   # `adapters: { agent: cli }` (below) must be set -- not `fake` -- for auto_accept to actually dispatch
#   # the five agent stages (style-analyze, style-review, source-survey, edit-plan, library-review); `harness
#   # doctor` flags `adapters.agent: fake` with `enabled: true` here as a FAIL.

# channel-publish only (sub-project 3): a "channel" role machine that picks approved kho items, packages them
# per channel.yaml, and uploads/schedules them via the legacy Playwright scripts. See channels/example/
# channel.yaml and docs/runbooks/channel-publish.md. Uncomment and add `workflows: [channel-publish@1.0.0]`
# above (and a `channels/<id>/channel.yaml` per channel, see channels/example/) to run it.
# adapters:
#   publisher: fake        # playwright | fake. playwright spawns the legacy scripts in each channel's
#                           # repo_dir for real; fake never touches a browser or the network -- use it until
#                           # every channel:<id>:* doctor row is green and you have logged in once with
#                           # `harness channel login <id>`.
#   agent: fake             # cli | fake. cli spawns `claude -p`/`codex exec` (picked by the `runtime` field
#                           # above) headless in the workspace for the `package` stage's `channel-package`
#                           # skill (and, sub-project 3B, the `channel-planning` workflow's `propose-topics`
#                           # stage, skill `channel-plan`); fake writes a placeholder output, useful before a
#                           # real agent CLI is set up on this machine (`harness doctor`'s `agent:runtime` row
#                           # checks for it; `channel:<id>:planning` also FAILs on `fake` when that channel's
#                           # own `planning.enabled: true`, see channels/example/channel.yaml).
#   # agent_argv: [claude, -p, "{prompt}", --output-format, json]   # override the default argv for `runtime`
#                           # (RUNTIME_COMMANDS in @harness/adapter-agent-cli); "{prompt}" is replaced with a
#                           # one-line pointer to agent-prompt.md. Only needed for a non-default CLI flag set,
#                           # or (in tests) to point at a fake CLI.
#   stats: fake              # playwright | fake, sub-project 3B: which StatsCollector reads a published
#                           # video's YouTube Studio Analytics for the channel learning loop. playwright spawns
#                           # a harness-owned, read-only Playwright script (packages/adapters/youtube-
#                           # playwright/scripts/collect-stats.mjs) against the *same* logged-in
#                           # `.upload-profile` as upload/schedule above -- no separate login step. fake never
#                           # touches a browser; use it until `channel:<id>:stats` is green and you have run
#                           # DoD #4 (docs/runbooks/channel-learning.md mục 9) at least once on this machine.
#   media: fake              # python | fake, sub-project 5A: which MediaEngine runs the four built-in media
#                           # stages of library-production@1.2.0 (media-index/transcribe/tts/fit-edl). python
#                           # spawns engines/python/{transcribe,tts}.py in the venv named under `media:` below
#                           # (WhisperX + OmniVoice on a real GPU); fake writes placeholder transcripts and
#                           # silent voice wavs -- fine for CI, useless for production, and `harness doctor`
#                           # raises a `media:engine` FAIL when a studio autopilot on >= 1.2.0 is still on it.

# Sub-project 5A: settings for the local Python media engine. Every key is optional with a default, so an
# older project.yaml parses unchanged; only `python` is REQUIRED once `adapters.media: python`. Build the
# venv OUTSIDE this project (nothing here is committed) -- docs/runbooks/studio-media.md mục 1 has the exact
# install commands, the pre-download step and the measured timings/VRAM on an RTX 3060.
# media:
#   python: E:/harness-venv/Scripts/python.exe   # absolute path to the venv interpreter. REQUIRED for python.
#   device: cuda:0          # cuda:<n> | cpu. cpu works but is far too slow for production.
#   transcribe:
#     engine: whisperx
#     model: large-v3       # faster-whisper model name
#     compute_type: float16 # float16 | int8_float16 | int8 -- step down if the GPU runs out of memory
#     batch_size: 8
#     # python: …           # overrides `media.python` for transcribe ONLY (two-venv fallback, see below)
#   tts:
#     engine: omnivoice
#     model: k2-fsa/OmniVoice
#     dtype: float16        # float16 | bfloat16 | float32
#     num_step: 32          # diffusion steps, 4-128. Higher is slower and not automatically better.
#     max_chars: 280        # 80-600: a narration line longer than this is split into chunks
#     pause_seconds: 0.25   # silence inserted between two chunks of the same line
#     loudness_lufs: -16    # per-line loudness normalisation target
#     # python: …           # overrides `media.python` for tts ONLY
#   scene:
#     threshold: 0.30       # ffmpeg scene-change threshold; lower it for handheld or changing-light footage
#     min_shot_seconds: 1.0
#     max_shot_seconds: 20  # caps a shot when no scene change is detected at all
#     proxy_height: 540     # height of the proxy media-index encodes for the survey agent to look at
#   watch:
#     max_sheets: 24
#   # Two venvs (`media.transcribe.python` + `media.tts.python`) are the documented fallback for a version
#   # conflict between OmniVoice's torch and WhisperX's dependencies. On the build machine there was NO
#   # conflict -- one venv held both -- so use the single `media.python` above unless pip actually fights you.
# publication:
#   verify_seconds: 900     # how often (>=60s) the worker's idle sweep asks the publisher whether an overdue
#                           # SCHEDULED job actually went public (settles PUBLISHED or parks
#                           # NEEDS_RECONCILIATION). `harness publish verify` runs the same sweep once by hand.
#   verify_grace_hours: 2   # a SCHEDULED job whose scheduled_at is this many hours in the past without
#                           # settling to PUBLISHED is treated as overdue by the sweep above.
# dashboard:
#   port: 5200              # `harness dashboard serve` binds 127.0.0.1:<port> (HARNESS_DASHBOARD_PORT env,
#                           # then --port on the CLI, override this in that order).
#   refresh_seconds: 60     # how often (>=10s) the worker's idle sweep rewrites dashboard/snapshot.json on
#                           # its own; `harness dashboard snapshot` writes one immediately by hand.
# learning:                 # sub-project 3B: cadence for the worker's own video-metrics collect sweep
#                           # (maybeCollectStats), independent of any per-channel learning/planning/auto_pick
#                           # block below in channels/<id>/channel.yaml. Present only if you want channels to
#                           # collect stats at all -- absent keeps the schema default (same numbers as below).
#   collect_seconds: 1800   # how often (>=60s) the worker sweeps for due video_metrics snapshots.
#   collect_batch: 5        # max (job, target_age_hours) pairs collected per sweep, across all channels.
