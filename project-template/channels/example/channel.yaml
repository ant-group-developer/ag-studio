# Copy this directory to `channels/<channel_id>/channel.yaml` (the directory name must equal channel_id
# below) to declare one channel this "channel" role ops project publishes to. See docs/runbooks/
# channel-publish.md and docs/superpowers/specs/2026-09-14-sub-project-3-channel-publish-design.md §1.3.
schema_version: harness.channel-config/v1

# ^[a-z0-9][a-z0-9-]*$, must equal the name of the directory this file lives in (channels/<channel_id>/).
channel_id: example

display_name: Example Channel

# Must already exist in this project's project.yaml.portfolios[].portfolio_id.
portfolio_id: portfolio-main

# #RRGGBB, used only by the dashboard (card's top border). Default #5b8cff if omitted.
color: "#5f4838"

# Path to the legacy channel repo (the pre-harness `D:\<channel>\scripts\...` project) this channel wraps.
# Use an **absolute** path with forward slashes -- a relative path here resolves against the *process's*
# current working directory when `harness` runs (plain Node `path.resolve()`, not relative to --project or
# to this file), which is almost never what you want outside of a test fixture. See
# fixtures/ops-project-channel/channels/*/channel.yaml for the one place a relative path is used on purpose
# (rewritten to an absolute temp path by the integration tests before every run).
repo_dir: D:/example-channel

# Selects outputs/<legacy_project_id>/episodes/... in repo_dir above -- must match the legacy repo's own
# channel.config.json.projectId (checked by the channel-identity checker and `harness doctor`'s
# channel:<id>:identity row). Default "project-01" if omitted.
legacy_project_id: project-01

youtube:
  # The real YouTube channel id (starts "UC..."), checked against the legacy repo's own
  # channel.config.json.youtube.channelId by the channel-identity checker (build-package stage) and
  # `harness doctor`'s channel:<id>:identity row -- a mismatch blocks build-package before any upload.
  expected_channel_id: UCXXXXXXXXXXXXXXXXXXXXXXXX

  # secret:// ref, NOT the email itself -- exactly two segments, ^secret://[a-z0-9-]+/[a-z0-9-]+$. Resolved
  # from the environment variable HARNESS_SECRET_<SCOPE upper, "-"->"_">_<NAME upper, "-"->"_">, e.g. the ref
  # below resolves from HARNESS_SECRET_YOUTUBE_EXAMPLE_EMAIL (see EnvSecretResolver.envName in
  # packages/core/src/config/secrets.ts). Set that variable in the shell/.env of the machine running
  # `harness worker`/`doctor` -- never commit the value. The harness never passes this value to the legacy
  # upload/schedule scripts (they read their own account email straight out of channel.config.json); it is
  # used only to cross-check that file against this one (channel-identity checker, doctor
  # channel:<id>:identity/:secrets) and is stripped from every log by the Redactor.
  account_email_ref: secret://youtube-example/email

publication:
  # IANA timezone name -- publish_times below and "today" (dashboard, max_daily_uploads) are both evaluated
  # in this timezone, not the machine's local time.
  timezone: America/New_York

  # HH:mm (24h) slots in the timezone above, at least one. `nextSlot()` books the next of these times that
  # still has room (see max_daily_uploads/min_gap_hours below), never more than 60 days out.
  publish_times: ["13:00"]

  # Max jobs counted SCHEDULED|PUBLISHED for this channel on the same calendar day (in the timezone above)
  # before nextSlot() pushes to the next day. Default 1 if omitted.
  max_daily_uploads: 1

  # Minimum hours between this channel's scheduled slots, even across different publish_times/days. Default
  # 20 if omitted.
  min_gap_hours: 20

  # Always "private" -- the legacy upload script always uploads PRIVATE first; going public on schedule is
  # YouTube's own native scheduling (publish-video-playwright.mjs --schedule), never a harness-side toggle.
  visibility_default: private

# All of seo.* is free text handed to the `channel-package` agent skill as-is (packaged into the brief for
# stage 2 "package") -- it is the main steering input for that skill's title/description/thumbnail choices.
# Every field defaults to "" (or [] for keywords) if omitted, but an empty channel here means a nearly
# content-free brief for the agent.
seo:
  niche: "..."
  audience: "..."
  angle: "..."
  language: en
  market: US
  keywords: ["...", "..."]
  title_rules: "max 100 characters, lead with a concrete number"
  # Free text with {chapters}/{playlist_url}/{channel_name} placeholders; the skill fills these in when it
  # writes output/package.json's metadata.description.
  description_template: |
    {chapters}

    {playlist_url}
    Subscribe to {channel_name} for more.

episode:
  # First episode number this harness will ever allocate for this channel (channel_sequence starts here).
  # Only matters once, before the first package is ever committed for this channel_id -- raising it later
  # has no effect on episode numbers already allocated. Default 1 if omitted.
  start: 1
  # Must contain the literal "{nn}" token (replaced with the episode number, zero-padded to at least 2
  # digits). Default "episode-{nn}" if omitted.
  dir_pattern: "episode-{nn}"

overlay:
  # Whether build-package calls the legacy repo's scripts/gen-thumb-overlay.mjs (if present) to burn the
  # agent's chosen overlay_text onto the chosen thumbnail candidate; false (or the script missing, or the
  # `package` stage's overlay_text being empty) just copies the candidate thumbnail as-is. Default true.
  enabled: true
  # left | right -- passed to gen-thumb-overlay.mjs as --side. Default right.
  #
  # NOTE (sub-project 5B): this block is about the THUMBNAIL of the legacy publish path only. It has nothing
  # to do with the text, subtitles and corner logo burned into the episode itself by `media-render`, and
  # `overlay.side` is deliberately NOT wired to `brand.logo.corner` -- the episode's logo corner comes from
  # the brand profile and from nowhere else.
  side: right

# --- sub-project 5B: the channel's BRAND lives in the kho, not in this file -----------------------------
# There is no brand key in channel.yaml. A channel has a brand when the shared kho holds
# `brands/<channel_id>/`, written by the CHANNEL role:
#
#   harness library brands set <channel_id> --from ./brand/brand.json --json
#
# That directory carries `brand.json` (`harness.brand/v1`: fonts, colours, text/subtitle/logo placement,
# default transition, music track list) plus the font and logo files it references, copied in by the command
# and checksummed. The harness ships NO font of its own -- pick one whose Vietnamese diacritics you have
# actually looked at (Be Vietnam Pro, Noto Sans) and declare `fonts.origin` honestly; nothing verifies it.
# No brand = the episode still renders, just with no text, no burned-in subtitles, no logo, no music and
# straight cuts (`render-report.brand: "absent"`). See docs/runbooks/studio-composition.md mục 2.

# Sub-project 3B (channel learning loop): all three blocks below are optional, every field defaults as shown --
# an absent block is the same as writing it with every field at its default (learning always runs; planning/
# auto_pick default OFF). See docs/runbooks/channel-learning.md for the full loop (empty channel -> request ->
# studio builds it -> this channel picks/publishes -> stats -> learned standard -> next request).
learning:
  # First stats snapshot this many hours after a job's published_at (YouTube Studio needs real traffic to
  # report anything meaningful before then -- the legacy repo waited the same 72h).
  horizon_hours: 72
  # Extra snapshots at these ages (hours) after publish, to see how a video's numbers settle over time; []
  # turns off every snapshot beyond the first (horizon_hours above still fires).
  recollect_hours: [168, 720]
  # A CTR hypothesis with fewer impressions than this floor is judged "void" (inconclusive), not
  # supported/refuted -- too little traffic to trust the number either way.
  min_impressions: 50
  # Minimum supported hypotheses in one group (same angle / title pattern / overlay-line count) before that
  # group can become the channel's learned standard for a dimension. Two alone is never enough on its own --
  # the group's lift is measured against the channel median, and the median of exactly two samples is their
  # own mean, so a two-sample group's lift is always exactly 1.0. See docs/runbooks/channel-learning.md mục 5.
  min_samples: 2
# Whether this channel proposes and files its own ContentRequest topics when its publish schedule needs more
# episodes than the kho currently has approved/claimed/in flight for it (channelDemand). Off by default --
# turning it on needs `adapters.agent: cli` project-wide (not `fake`; `harness doctor`'s `channel:<id>:planning`
# row FAILs otherwise) so the `channel-plan` skill can actually propose something real.
planning:
  enabled: false
  # How many of this channel's next publish-schedule slots (nextSlot(), same policy as publication.* above)
  # must have an item ready before planning stops proposing more.
  lookahead_slots: 3
  # Max new topics one channel-planning run's agent may propose (and create-requests may turn into requests).
  topics_per_run: 3
  # Hard cap on this channel's own open ContentRequest count in the kho at once -- planning stops (event
  # channel.planning_skipped { reason: "open-cap" }) once it is reached, even if lookahead_slots still wants
  # more, so the studio is never handed more open work than this.
  max_open_requests: 3
  # How often (>=60s) the worker's idle sweep runs planning for this channel (`harness channel plan-requests
  # <id>` runs it once by hand, bypassing this cadence). At most one channel-planning run per channel per UTC
  # calendar day regardless of how low this is set.
  check_seconds: 3600
# Whether this channel automatically claims an approved kho item (preferring one that answers its own open
# requests) and runs channel-publish on it, with no human `library pick` in between. Off by default.
auto_pick:
  enabled: false
  # Max channel-publish runs this channel's own auto-pick sweep may have in flight at once; does not cap runs
  # started by a human `library pick` + `plan` + `enqueue`.
  max_concurrent_runs: 1
# Sub-project 5A: this channel's default TTS voice. Optional -- a channel that only asks for `voice: none` or
# `voice: original` needs no voice at all. The profile itself lives in the KHO (`voices/<voice_id>/`) and is
# written by this same `channel` role with `harness library voices add`; the studio only ever reads it.
# `harness library request create --voice tts` still needs its own `--voice-id` (required, checked at create
# time against an ACTIVE profile) -- this field is the channel's default, not a substitute for that flag.
# NEVER clone a real person's voice without the rights to do so: `--origin synthetic|own|licensed` is
# mandatory and the harness cannot verify it, it only records what you declared. See
# docs/runbooks/studio-media.md mục 4 for the voice-design route that keeps `synthetic` literally true.
# voice: { voice_id: voice_01ARZ3NDEKTSV4RRFFQ69G5FAV }
