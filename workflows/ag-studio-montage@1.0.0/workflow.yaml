schema_version: harness.workflow/v1
id: ag-studio-montage
version: 1.0.0
defaults: {}
# AG Studio "ghép video": the production workflow without narration and TTS (user decision 2026-09-30: for now a
# video is only the chosen footage cut together, with its own sound). Same stages, scripts, checkers and gates
# as ag-studio-production@1.0.0, minus `narration` and `tts`:
#   intake -> catalog -> treatment -> [approve-treatment] -> select-shots -> [shot-board] -> build-timeline
#   -> [edit = web editor] -> render-final (+qc) -> export
# build-timeline cuts every beat to the treatment's seconds and keeps the footage's own audio. Which of the two
# workflows new runs use is the engine's STUDIO_WORKFLOW setting; a resumed run keeps its own.
stages:
  - key: intake
    executor: { type: script, script: studio-intake }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_brief, mime_type: application/json, name: brief.json }
  - key: catalog
    executor: { type: script, script: studio-catalog }
    depends_on: [intake]
    retry: { max_attempts: 3, backoff_seconds: [30, 120], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_catalog, mime_type: application/json, name: catalog.json }
  - key: treatment
    executor: { type: agent, skill: studio-treatment, brief: "Viết treatment (các beat) cho video theo studio_brief, chỉ dựa trên footage có trong studio_catalog." }
    depends_on: [intake, catalog]
    requires_resources: [claude]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, treatment-valid]
    outputs:
      - { type: treatment, mime_type: application/json, name: treatment.json }
  - key: approve-treatment
    executor: { type: gate, brief: "Người dùng sửa và duyệt từng beat của treatment trên web." }
    depends_on: [treatment, intake]
    required_checks: [schema-valid, output-exists, checksum-match, treatment-valid]
    outputs:
      - { type: treatment, mime_type: application/json, name: treatment.json }
  - key: select-shots
    executor: { type: agent, skill: studio-select-shots, brief: "Chọn đoạn footage cho từng beat của treatment đã duyệt, kèm 3-4 phương án thay thế mỗi beat." }
    depends_on: [approve-treatment, catalog, intake]
    requires_resources: [claude]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, selection-valid]
    outputs:
      - { type: selection, mime_type: application/json, name: selection.json }
  - key: shot-board
    executor: { type: gate, brief: "Người dùng xem keyframe/preview từng beat và đổi đoạn bằng phương án thay thế." }
    depends_on: [select-shots, approve-treatment, catalog, intake]
    required_checks: [schema-valid, output-exists, checksum-match, selection-valid]
    outputs:
      - { type: selection, mime_type: application/json, name: selection.json }
  - key: build-timeline
    executor: { type: script, script: studio-build-timeline }
    depends_on: [shot-board, approve-treatment, catalog, intake]
    required_checks: [schema-valid, output-exists, checksum-match, timeline-schema-valid]
    outputs:
      - { type: timeline_v2, mime_type: application/json, name: timeline.json }
  - key: edit
    executor: { type: gate, brief: "Web editor: mỗi lần lưu là một revision; bấm Hoàn tất để nộp revision mới nhất." }
    depends_on: [build-timeline, intake]
    required_checks: [schema-valid, output-exists, checksum-match, timeline-valid]
    outputs:
      - { type: timeline_v2, mime_type: application/json, name: timeline.json }
  - key: render-final
    executor: { type: farm, job: studio.render_final }
    config: { payload_builder: studio-render-final }
    depends_on: [edit, intake]
    requires_resources: [farm]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, studio-render-valid]
    outputs:
      - { type: final_video, mime_type: video/mp4, name: final.mp4 }
      - { type: render_manifest, mime_type: application/json, name: render.json }
  - key: export
    executor: { type: script, script: studio-export }
    depends_on: [render-final, edit, intake]
    retry: { max_attempts: 3, backoff_seconds: [30, 120], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, export-valid]
    outputs:
      - { type: studio_export, mime_type: application/json, name: export.json }
      - { type: subtitles, mime_type: application/x-subrip, name: captions.srt }
      - { type: subtitles_vtt, mime_type: text/vtt, name: captions.vtt }
