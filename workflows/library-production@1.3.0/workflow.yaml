schema_version: harness.workflow/v1
id: library-production
version: 1.3.0
defaults: {}
stages:
  - key: intake
    executor: { type: script, script: library-intake }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: brief, mime_type: application/json, name: brief.json }
  - key: media-index
    executor: { type: script, script: media-index }
    depends_on: [intake]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: shots, mime_type: application/json, name: shots.json }
      - { type: proxy_set, mime_type: application/x-directory, kind: directory, name: proxy }
  - key: media-transcribe
    executor: { type: script, script: media-transcribe }
    depends_on: [media-index]
    requires_resources: [gpu]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: transcript, mime_type: application/json, name: transcript.json }
  - key: watch-source
    executor: { type: script, script: watch-source }
    depends_on: [media-index, media-transcribe]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: watch, mime_type: application/x-directory, kind: directory, name: watch }
  - key: survey-source
    executor: { type: agent, skill: source-survey, brief: "Đọc shots.json (harness.shots/v2, nhiều source) và transcript.json; chấm từng shot trong shots.json bằng watch/ theo brief.json; chấm theo shot_id, ghi output/survey.md và output/survey.json (harness.survey-index/v2)." }
    depends_on: [watch-source, media-index, media-transcribe, intake]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, survey-valid]
    outputs:
      - { type: survey, mime_type: text/markdown, name: survey.md }
      - { type: survey_index, mime_type: application/json, name: survey.json }
  - key: plan-edit
    executor: { type: agent, skill: edit-plan, brief: "Từ survey.json/survey.md, brief.json (style, thời lượng đích, request_notes) và shots.json, viết output/edl.json (harness.edl/v1), output/edit-plan.json, output/narration.json (harness.narration/v1) với edl_order cho từng dòng; voice original thì lines rỗng và cắt theo câu trọn trong transcript. Viết output/overlays.json (harness.overlays/v1): title/callout/lower_third neo vào line_id/edl_order, transitions ghi đè, music.mood." }
    depends_on: [survey-source, watch-source, intake, media-index, media-transcribe]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, edl-valid, overlays-valid]
    outputs:
      - { type: edl, mime_type: application/json, name: edl.json }
      - { type: edit_plan, mime_type: application/json, name: edit-plan.json }
      - { type: narration, mime_type: application/json, name: narration.json }
      # An edit plan with no text on screen at all is a legitimate plan, so this one output may be absent:
      # `media-compose` composes without overlays and the agent runtime does not fail the stage for it.
      - { type: overlays, mime_type: application/json, name: overlays.json, optional: true }
  - key: media-tts
    executor: { type: script, script: media-tts }
    depends_on: [plan-edit, intake]
    requires_resources: [gpu]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, tts-valid]
    outputs:
      - { type: voice_set, mime_type: application/x-directory, kind: directory, name: voice }
      - { type: narration_timing, mime_type: application/json, name: narration-timing.json }
  - key: media-fit-edl
    executor: { type: script, script: media-fit-edl }
    depends_on: [plan-edit, media-tts, survey-source, media-index, media-transcribe, intake]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match, edl-valid]
    outputs:
      - { type: edl, mime_type: application/json, name: edl.json }
      - { type: fit_report, mime_type: application/json, name: fit-report.json }
      - { type: timeline, mime_type: application/json, name: timeline.json }
  # `cut` and `assemble` are gone from 1.3.0: `media-render` produces both the episode AND the `clip_set`
  # (`cuts/<order>.mp4`) from the same mezzanine tier, so cutting twice bought nothing. The two fixture
  # wrappers stay in place for 1.1.0/1.2.0, untouched.
  - key: media-compose
    executor: { type: script, script: media-compose }
    depends_on: [media-fit-edl, plan-edit, intake, media-index, media-tts]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match, composition-valid]
    outputs:
      - { type: composition, mime_type: application/json, name: composition.json }
      - { type: captions, mime_type: application/x-directory, kind: directory, name: captions }
      - { type: overlay_ass, mime_type: text/plain, name: overlay.ass }
  - key: media-render
    executor: { type: script, script: media-render }
    # `media-index` is here for its `shots` output, not for the picture: `audio-integrity` needs it to tell a
    # deliberately silent episode (`voice: none` over sources that carry no audio track at all) from an
    # episode that lost its audio, and it is the only stage carrying `has_audio` per source.
    depends_on: [media-compose, media-fit-edl, media-tts, media-index, intake]
    requires_resources: [gpu]
    # The 2-hour cap the task brief puts here lives on the built-in `media-render` ScriptCommand instead
    # (`builtinMediaCommands`, packages/cli/src/commands/media.ts): `stageDefinitionSchema` has no
    # `timeout_seconds` key, and adding one would have had nothing to read it -- `ScriptExecutor` takes its
    # timeout from the command, capped by the stage deadline.
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, media-probe, duration-range, audio-integrity, brief-duration, clip-set-complete, render-valid]
    outputs:
      - { type: episode_video, mime_type: video/mp4, name: full-episode.mp4 }
      - { type: clip_set, mime_type: application/x-directory, kind: directory, name: cuts }
      - { type: render_report, mime_type: application/json, name: render-report.json }
  - key: watch-episode
    executor: { type: script, script: watch-episode }
    depends_on: [media-render]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: watch, mime_type: application/x-directory, kind: directory, name: watch }
  - key: thumbnail-candidates
    executor: { type: script, script: thumbnail-candidates }
    depends_on: [media-render]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: thumbnail_set, mime_type: application/x-directory, kind: directory, name: thumbnails }
  - key: library-export
    executor: { type: script, script: library-export }
    depends_on: [media-render, thumbnail-candidates, plan-edit, intake, media-compose]
    required_checks: [schema-valid, output-exists, checksum-match, library-export-valid]
    outputs:
      - { type: export_receipt, mime_type: application/json, name: export-receipt.json }
  - key: library-review
    executor: { type: agent, skill: library-review, brief: "Soi bản dựng qua watch/ (episode), đối chiếu edit-plan.json và brief.json; đọc fit-report.json, timeline.json và edl.json NẰM CÙNG THƯ MỤC với fit-report.json (bản đã khớp hình theo lời) — edl.json cạnh edit-plan.json là bản pre-fit, chỉ để tham khảo; đọc CẢ HAI file composition.json (warnings, text_dropped) và render-report.json: từ chối khi downgraded > 30 % requested, text_events.dropped không rỗng, music null dù brand có track, word_interpolated > 10 % số từ, loudness ngoài [−16,−12]; ghi output/review.json (harness.review/v1) với 6 checks cố định; ≥1 fail → rejected." }
    depends_on: [watch-episode, library-export, plan-edit, intake, media-fit-edl, media-compose, media-render]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: review, mime_type: application/json, name: review.json }
  - key: library-apply-review
    executor: { type: script, script: library-apply-review }
    depends_on: [library-review, library-export]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: apply_receipt, mime_type: application/json, name: apply-receipt.json }
