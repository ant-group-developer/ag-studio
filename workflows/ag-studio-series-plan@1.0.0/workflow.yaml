schema_version: harness.workflow/v1
id: ag-studio-series-plan
version: 1.0.0
defaults: {}
# AG Studio series-plan workflow (GĐ2).  One run per production.
#   series-intake → research → catalog → trend-report → plan-episodes →
#   [approve-plan] → spawn-episodes
stages:
  - key: intake
    executor: { type: script, script: studio-series-intake }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_brief, mime_type: application/json, name: brief.json }

  - key: research
    executor: { type: script, script: studio-research }
    depends_on: [intake]
    retry: { max_attempts: 3, backoff_seconds: [30, 120], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_research, mime_type: application/json, name: research.json }

  - key: catalog
    executor: { type: script, script: studio-catalog }
    depends_on: [intake]
    retry: { max_attempts: 3, backoff_seconds: [30, 120], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_catalog, mime_type: application/json, name: catalog.json }

  - key: trend-report
    executor:
      type: agent
      skill: studio-trend-report
      brief: "Dựa trên nghiên cứu YouTube và brief của series, viết một báo cáo xu hướng ngắn gọn (studio_trend_report) giúp người lên kế hoạch hiểu pattern nội dung nào đang hoạt động tốt."
    depends_on: [research, intake]
    requires_resources: [claude]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, trend-report-valid]
    outputs:
      - { type: trend_report, mime_type: application/json, name: trend-report.json }

  - key: plan-episodes
    executor:
      type: agent
      skill: studio-plan-episodes
      brief: "Dựa trên brief, báo cáo xu hướng và danh sách footage trong catalog, đề xuất kế hoạch các tập cho series (series_plan). Mỗi tập cần: tiêu đề mạnh, hook 5 giây đầu, logline, danh sách video theo thứ tự, phương án thay thế, các chữ hiển thị trên màn."
    depends_on: [trend-report, catalog, intake]
    requires_resources: [claude]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, series-plan-valid]
    outputs:
      - { type: series_plan, mime_type: application/json, name: series-plan.json }

  - key: approve-plan
    executor: { type: gate, brief: "Người dùng xem và chỉnh sửa kế hoạch tập, bấm Duyệt để nộp." }
    depends_on: [plan-episodes, catalog, intake]
    required_checks: [schema-valid, output-exists, checksum-match, series-plan-valid]
    outputs:
      - { type: series_plan, mime_type: application/json, name: series-plan.json }

  - key: spawn-episodes
    executor: { type: script, script: studio-spawn-episodes }
    depends_on: [approve-plan, trend-report, catalog, intake]
    retry: { max_attempts: 3, backoff_seconds: [30, 120], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: studio_episodes, mime_type: application/json, name: episodes.json }
