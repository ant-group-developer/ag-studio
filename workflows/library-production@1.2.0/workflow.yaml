schema_version: harness.workflow/v1
id: library-production
version: 1.2.0
defaults: {}
stages:
  - key: intake
    executor: { type: script, script: library-intake }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: brief, mime_type: application/json, name: brief.json }
  - key: media-index
    executor: { type: script, script: media-index }
    depends_on: [intake]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: shots, mime_type: application/json, name: shots.json }
      - { type: proxy_set, mime_type: application/x-directory, kind: directory, name: proxy }
  - key: media-transcribe
    executor: { type: script, script: media-transcribe }
    depends_on: [media-index]
    requires_resources: [gpu]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: transcript, mime_type: application/json, name: transcript.json }
  - key: watch-source
    executor: { type: script, script: watch-source }
    depends_on: [media-index, media-transcribe]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: watch, mime_type: application/x-directory, kind: directory, name: watch }
  - key: survey-source
    executor: { type: agent, skill: source-survey, brief: "Đọc shots.json (harness.shots/v2, nhiều source) và transcript.json; chấm từng shot trong shots.json bằng watch/ theo brief.json; chấm theo shot_id, ghi output/survey.md và output/survey.json (harness.survey-index/v2)." }
    depends_on: [watch-source, media-index, media-transcribe, intake]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, survey-valid]
    outputs:
      - { type: survey, mime_type: text/markdown, name: survey.md }
      - { type: survey_index, mime_type: application/json, name: survey.json }
  - key: plan-edit
    executor: { type: agent, skill: edit-plan, brief: "Từ survey.json/survey.md, brief.json (style, thời lượng đích, request_notes) và shots.json, viết output/edl.json (harness.edl/v1), output/edit-plan.json, output/narration.json (harness.narration/v1) với edl_order cho từng dòng; voice original thì lines rỗng và cắt theo câu trọn trong transcript." }
    depends_on: [survey-source, watch-source, intake, media-index, media-transcribe]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, edl-valid]
    outputs:
      - { type: edl, mime_type: application/json, name: edl.json }
      - { type: edit_plan, mime_type: application/json, name: edit-plan.json }
      - { type: narration, mime_type: application/json, name: narration.json }
  - key: media-tts
    executor: { type: script, script: media-tts }
    depends_on: [plan-edit, intake]
    requires_resources: [gpu]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match, tts-valid]
    outputs:
      - { type: voice_set, mime_type: application/x-directory, kind: directory, name: voice }
      - { type: narration_timing, mime_type: application/json, name: narration-timing.json }
  - key: media-fit-edl
    executor: { type: script, script: media-fit-edl }
    depends_on: [plan-edit, media-tts, survey-source, media-index, media-transcribe, intake]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match, edl-valid]
    outputs:
      - { type: edl, mime_type: application/json, name: edl.json }
      - { type: fit_report, mime_type: application/json, name: fit-report.json }
      - { type: timeline, mime_type: application/json, name: timeline.json }
  - key: cut
    executor: { type: script, script: cut }
    depends_on: [media-fit-edl]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match, clip-set-complete]
    outputs:
      - { type: clip_set, mime_type: application/x-directory, kind: directory, name: cuts }
  - key: assemble
    executor: { type: script, script: assemble }
    # `media-index` is here for its `shots` output, not for the picture: `audio-integrity` needs it to tell a
    # deliberately silent episode (`voice: none` over sources that carry no audio track at all) from an
    # episode that lost its audio, and it is the only stage carrying `has_audio` per source.
    depends_on: [cut, intake, media-tts, media-fit-edl, media-index]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match, media-probe, duration-range, audio-integrity, brief-duration]
    outputs:
      - { type: episode_video, mime_type: video/mp4, name: full-episode.mp4 }
  - key: watch-episode
    executor: { type: script, script: watch-episode }
    depends_on: [assemble]
    requires_resources: [cpu]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: watch, mime_type: application/x-directory, kind: directory, name: watch }
  - key: thumbnail-candidates
    executor: { type: script, script: thumbnail-candidates }
    depends_on: [cut]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: thumbnail_set, mime_type: application/x-directory, kind: directory, name: thumbnails }
  - key: library-export
    executor: { type: script, script: library-export }
    depends_on: [assemble, thumbnail-candidates, plan-edit, intake]
    required_checks: [schema-valid, output-exists, checksum-match, library-export-valid]
    outputs:
      - { type: export_receipt, mime_type: application/json, name: export-receipt.json }
  - key: library-review
    executor: { type: agent, skill: library-review, brief: "Soi bản dựng qua watch/ (episode), đối chiếu edit-plan.json và brief.json; đọc fit-report.json; ghi output/review.json (harness.review/v1) với 6 checks cố định; ≥1 fail → rejected." }
    depends_on: [watch-episode, library-export, plan-edit, intake, media-fit-edl]
    retry: { max_attempts: 2, backoff_seconds: [60], retry_on: [transient, abandoned] }
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: review, mime_type: application/json, name: review.json }
  - key: library-apply-review
    executor: { type: script, script: library-apply-review }
    depends_on: [library-review, library-export]
    required_checks: [schema-valid, output-exists, checksum-match]
    outputs:
      - { type: apply_receipt, mime_type: application/json, name: apply-receipt.json }
